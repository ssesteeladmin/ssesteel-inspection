// =============================================================================
// API HELPER
// =============================================================================
const API = {
    get: async (url) => { const r = await fetch('/api' + url); if (!r.ok) throw new Error(r.statusText); return r.json(); },
    post: async (url, data) => { const r = await fetch('/api' + url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) }); if (!r.ok) { const e = await r.json().catch(() => ({})); throw new Error(e.detail || r.statusText); } return r.json(); },
    put: async (url, data) => { const r = await fetch('/api' + url, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) }); if (!r.ok) throw new Error(r.statusText); return r.json(); },
    del: async (url) => { const r = await fetch('/api' + url, { method: 'DELETE' }); if (!r.ok) throw new Error(r.statusText); return r.json(); }
};

// =============================================================================
// DYNAMIC EQUIPMENT DISPLAY — works for ANY equipment from the API
// =============================================================================
// Known equipment types get specific icons/labels; unknown types get smart defaults
const KNOWN_DISPLAY = {
    'telehandler_33k': { icon: '🔴', label: 'Telehandler 33K' },
    'telehandler_12k': { icon: '🏗️', label: 'Telehandler 12K' },
    'emi_tube_cutter': { icon: '⚙️', label: 'EMI Tube Cutter' },
    'miller_welder':   { icon: '🔥', label: 'Miller Welder' },
    'piranha_laser':   { icon: '🔆', label: 'Piranha Fiber Laser' },
    'python_beam_line':{ icon: '📐', label: 'Python Beam Line' },
    'python_plasma':   { icon: '⚡', label: 'Python Plasma Table' },
    'press_brake':     { icon: '🔧', label: 'Press Brake' },
    'plate_roller':    { icon: '🔄', label: 'Plate Roller' },
};

function getEquipmentDisplay(equipType) {
    if (KNOWN_DISPLAY[equipType]) return KNOWN_DISPLAY[equipType];
    // Smart fallback for unknown types — derive from type string
    const label = equipType.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
    // Try to pick a reasonable icon based on keywords
    const t = equipType.toLowerCase();
    if (t.includes('telehandler') || t.includes('forklift') || t.includes('crane') || t.includes('lift')) return { icon: '🏗️', label };
    if (t.includes('weld')) return { icon: '🔥', label };
    if (t.includes('laser') || t.includes('cut')) return { icon: '🔆', label };
    if (t.includes('plasma')) return { icon: '⚡', label };
    if (t.includes('press') || t.includes('brake')) return { icon: '🔧', label };
    if (t.includes('roll')) return { icon: '🔄', label };
    if (t.includes('drill') || t.includes('saw')) return { icon: '⚙️', label };
    return { icon: '📦', label };
}

// =============================================================================
// DYNAMIC EQUIPMENT NICKNAME — derives from the actual equipment data
// =============================================================================
function getEquipmentNickname(eq) {
    if (!eq) return '';
    // Prettify equipment_id: replace dashes with spaces, capitalize
    const id = eq.equipment_id || '';
    // If the ID already looks like a name (e.g. "Yellow Cat"), use it directly
    if (id && !id.includes('-')) return id;
    // Otherwise turn "BIG-RED-01" into "BIG RED" (drop trailing numbers)
    const parts = id.split('-');
    // Remove last part if it's purely numeric (like "01")
    if (parts.length > 1 && /^\d+$/.test(parts[parts.length - 1])) parts.pop();
    const nickname = parts.join(' ');
    // If we got a good nickname, use it; otherwise fall back to make + model
    if (nickname && nickname.length > 1) return nickname;
    return `${eq.make || ''} ${eq.model || ''}`.trim() || id;
}

// CHECKLIST MAPPING — maps equipment_type to the right checklist
// Falls back to generic for unknown types
// =============================================================================
function getChecklistForEquipment(equipmentType) {
    const t = (equipmentType || '').toLowerCase();
    // Exact matches first
    if (t === 'telehandler_33k' || t === 'telehandler_12k') return TELEHANDLER_CHECKLISTS;
    if (t === 'emi_tube_cutter') return EMI_TUBE_CUTTER_CHECKLISTS;
    if (t === 'miller_welder') return MILLER_WELDER_CHECKLISTS;
    if (t === 'piranha_laser') return PIRANHA_LASER_CHECKLISTS;
    if (t === 'python_beam_line') return PYTHON_BEAM_LINE_CHECKLISTS;
    if (t === 'python_plasma') return PYTHON_PLASMA_CHECKLISTS;
    if (t === 'press_brake') return PRESS_BRAKE_CHECKLISTS;
    if (t === 'plate_roller') return PLATE_ROLLER_CHECKLISTS;
    // Keyword-based fallback for new types that are similar to existing ones
    if (t.includes('telehandler') || t.includes('forklift') || t.includes('crane') || t.includes('lift')) return TELEHANDLER_CHECKLISTS;
    if (t.includes('weld') || t.includes('mig') || t.includes('tig')) return MILLER_WELDER_CHECKLISTS;
    if (t.includes('laser')) return PIRANHA_LASER_CHECKLISTS;
    if (t.includes('plasma') && t.includes('table')) return PYTHON_PLASMA_CHECKLISTS;
    if (t.includes('plasma')) return PYTHON_PLASMA_CHECKLISTS;
    if (t.includes('beam') || t.includes('conveyor')) return PYTHON_BEAM_LINE_CHECKLISTS;
    if (t.includes('press') || t.includes('brake')) return PRESS_BRAKE_CHECKLISTS;
    if (t.includes('roll')) return PLATE_ROLLER_CHECKLISTS;
    if (t.includes('cut') || t.includes('saw') || t.includes('tube')) return EMI_TUBE_CUTTER_CHECKLISTS;
    // Complete fallback — generic checklist
    return GENERIC_CHECKLISTS;
}

function App() {
    const [page, setPage] = useState('dashboard');
    const [equipment, setEquipment] = useState([]);
    const [loading, setLoading] = useState(true);
    const [notification, setNotification] = useState(null);

    const notify = (msg, type = 'success') => {
        setNotification({ msg, type });
        setTimeout(() => setNotification(null), 3000);
    };

    const loadEquipment = async () => {
        try {
            const data = await API.get('/equipment');
            setEquipment(data);
            return data;
        } catch (e) {
            console.error('Failed to load equipment:', e);
            return [];
        }
    };

    // Load equipment from API, seed if database is empty
    const seedEquipment = async () => {
        try {
            const existing = await loadEquipment();
            if (existing.length === 0) {
                for (const eq of EQUIPMENT_SEED) {
                    try { await API.post('/equipment', eq); } catch (e) { console.log('Seed skip:', eq.equipment_id); }
                }
                await loadEquipment();
                notify('Equipment seeded successfully');
            }
        } catch (e) { console.error('Seed failed:', e); }
        setLoading(false);
    };

    useEffect(() => { seedEquipment(); }, []);

    if (loading) return (
        <div className="min-h-screen flex items-center justify-center">
            <div className="text-center">
                <div className="w-12 h-12 border-4 border-sse-orange border-t-transparent rounded-full animate-spin mx-auto mb-4"></div>

                        { id: 'dashboard', label: 'Dashboard', icon: '📊' },
                        { id: 'new-inspection', label: 'New Inspection', icon: '📋' },
                        { id: 'history', label: 'History', icon: '📜' },
                        { id: 'work-tickets', label: 'Work Tickets', icon: '🔧' },
                        { id: 'equipment', label: 'Equipment', icon: '🏗️' },

function DashboardPage({ equipment }) {
    const [stats, setStats] = useState(null);
    const [tickets, setTickets] = useState([]);
    const [loading, setLoading] = useState(true);

    useEffect(() => {
        Promise.all([
            API.get('/dashboard'),
            API.get('/work-tickets?status=all').catch(() => [])
        ]).then(([dashData, tix]) => {
            setStats(dashData);
            setTickets(Array.isArray(tix) ? tix : []);
        }).catch(console.error).finally(() => setLoading(false));
    }, []);

    // Determine repair status for a recent inspection based on work tickets
    const getInspRepairStatus = (insp) => {
        if (insp.overall_status === 'safe') return { label: 'SAFE', color: 'bg-green-100 text-green-700' };
        if (insp.overall_status === 'out_of_service') {
            const related = tickets.filter(t => t.inspection_id === insp.id);
            const allDone = related.length > 0 && related.every(t => t.status === 'completed');
            if (allDone) {
                const dates = related.map(t => t.completed_at).filter(Boolean);
                const latest = dates.length > 0 ? new Date(Math.max(...dates.map(d => new Date(d)))).toLocaleDateString() : '';
                return { label: `REPAIRED${latest ? ' — ' + latest : ''}`, color: 'bg-green-100 text-green-700' };
            }
            return { label: 'OUT OF SERVICE', color: 'bg-red-100 text-red-700' };
        }
        // needs_repair
        const related = tickets.filter(t => t.inspection_id === insp.id);
        if (related.length === 0) return { label: 'NEEDS REPAIR', color: 'bg-yellow-100 text-yellow-700' };
        const allDone = related.every(t => t.status === 'completed');
        if (allDone) {
            const dates = related.map(t => t.completed_at).filter(Boolean);
            const latest = dates.length > 0 ? new Date(Math.max(...dates.map(d => new Date(d)))).toLocaleDateString() : '';
            return { label: `REPAIRED${latest ? ' — ' + latest : ''}`, color: 'bg-green-100 text-green-700' };
        }
        const doneCount = related.filter(t => t.status === 'completed').length;
        if (doneCount > 0) return { label: `${doneCount}/${related.length} REPAIRED`, color: 'bg-orange-100 text-orange-700' };
        return { label: 'NEEDS REPAIR', color: 'bg-yellow-100 text-yellow-700' };
    };

    if (loading) return <LoadingSpinner />;

    return (
        <div className="space-y-6">
            <h2 className="text-2xl font-bold text-sse-navy">Dashboard</h2>

            {/* Stat Cards */}
            <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                <StatCard label="Total Equipment" value={equipment.length} icon="🏗️" color="blue" />
                <StatCard label="Open Work Tickets" value={stats?.open_work_tickets || 0} icon="🔧" color={stats?.open_work_tickets > 0 ? 'yellow' : 'green'} />
                <StatCard label="High Priority" value={stats?.high_priority_tickets || 0} icon="⚠️" color={stats?.high_priority_tickets > 0 ? 'red' : 'green'} />
                <StatCard label="Field / Shop" value={`${stats?.equipment_by_category?.field || 0} / ${stats?.equipment_by_category?.shop || 0}`} icon="📦" color="purple" />
            </div>

            {/* Equipment Status */}
            <div className="bg-white rounded-xl shadow-sm border p-6">
                <h3 className="text-lg font-bold text-sse-navy mb-4">Equipment Status</h3>
                <div className="space-y-2">
                    {(stats?.equipment_status || []).map((eq, i) => {
                        const display = getEquipmentDisplay(eq.equipment_type);
                        return (
                            <div key={i} className="flex items-center justify-between p-3 bg-gray-50 rounded-lg">
                                <div className="flex items-center gap-3">
                                    <span className="text-xl">{display.icon}</span>
                                    <div>
                                        <p className="font-medium">{getEquipmentNickname(eq)} <span className="text-gray-400 text-sm">({eq.equipment_id})</span></p>
                                        <p className="text-sm text-gray-500">{eq.make} {eq.model}</p>
                                    </div>
                                </div>
                                <div className="text-right">
                                    {eq.last_inspection ? (
                                        <span className="text-sm text-green-600 font-medium">Last: {eq.last_inspection}</span>
                                    ) : (
                                        <span className="text-sm text-red-500 font-medium">No inspections yet</span>
                                    )}
                                </div>
                            </div>
                        );
                    })}
                    {(!stats?.equipment_status || stats.equipment_status.length === 0) && (
                        <p className="text-gray-500 text-center py-4">No equipment found. Add equipment first.</p>
                    )}
                </div>
            </div>

            {/* Recent Inspections */}
            <div className="bg-white rounded-xl shadow-sm border p-6">
                <h3 className="text-lg font-bold text-sse-navy mb-4">Recent Inspections</h3>
                <div className="space-y-2">
                    {(stats?.recent_inspections || []).map((insp, i) => {
                        const rs = getInspRepairStatus(insp);
                        return (
                        <div key={i} className="flex items-center justify-between p-3 bg-gray-50 rounded-lg">
                            <div>
                                <p className="font-medium">{insp.equipment_code} — <span className="capitalize">{insp.inspection_type}</span></p>
                                <p className="text-sm text-gray-500">By {insp.inspector_name} on {insp.inspection_date}</p>
                            </div>
                            <span className={`px-3 py-1 rounded-full text-xs font-bold ${rs.color}`}>{rs.label}</span>
                        </div>
                        );
                    })}
                    {(!stats?.recent_inspections || stats.recent_inspections.length === 0) && (
                        <p className="text-gray-500 text-center py-4">No inspections yet. Start a new inspection!</p>
                    )}
                </div>
            </div>
        </div>
    );
}

    const colors = {
        blue: 'bg-blue-50 border-blue-200', green: 'bg-green-50 border-green-200',
        yellow: 'bg-yellow-50 border-yellow-200', red: 'bg-red-50 border-red-200',
        purple: 'bg-purple-50 border-purple-200',
    };
    return (
        <div className={`rounded-xl border-2 p-4 ${colors[color] || colors.blue}`}>
            <div className="flex items-center justify-between mb-2">
                <span className="text-2xl">{icon}</span>
            </div>
            <p className="text-2xl font-bold text-gray-800">{value}</p>
            <p className="text-sm text-gray-600">{label}</p>
        </div>
    );
}

    const [hourMeter, setHourMeter] = useState('');
    const [generalComments, setGeneralComments] = useState('');
    const [overallStatus, setOverallStatus] = useState('');
    const [submitting, setSubmitting] = useState(false);

    // Initialize form data when checklist is selected
    useEffect(() => {
        if (selectedEquip && inspType) {
            const checklists = getChecklistForEquipment(selectedEquip.equipment_type);
            const checklist = checklists[inspType];
            const initial = {};
            checklist.sections.forEach(section => {
                section.items.forEach(item => {
                    const key = `${section.name}|||${item}`;
                    initial[key] = { status: '', comments: '' };
                });
            });
            setFormData(initial);
        }
    }, [selectedEquip, inspType]);

    const setItemStatus = (key, status) => {
        setFormData(prev => ({ ...prev, [key]: { ...prev[key], status } }));
    };

    const setItemComment = (key, comments) => {
        setFormData(prev => ({ ...prev, [key]: { ...prev[key], comments } }));
    };

    const allItemsChecked = () => {
        return Object.values(formData).every(item => item.status !== '');
    };

    const handleSubmit = async () => {
        if (!inspectorName.trim()) { notify('Please enter inspector name', 'error'); return; }
        if (!allItemsChecked()) { notify('Please check all items before submitting', 'error'); return; }
        if (!overallStatus) { notify('Please select overall equipment status (Safe/Needs Repair/Out of Service)', 'error'); return; }

        setSubmitting(true);
        try {
            const items = Object.entries(formData).map(([key, val]) => {
                const [category, item_name] = key.split('|||');
                return { category, item_name, status: val.status, comments: val.comments || null };
            });

            const payload = {
                equipment_id: selectedEquip.id,
                inspection_type: inspType,
                inspection_date: new Date().toISOString().split('T')[0],
                inspector_name: inspectorName,
                hour_meter_reading: hourMeter ? parseInt(hourMeter) : null,
                overall_status: overallStatus,
                general_comments: generalComments || null,
                items
            };

            const result = await API.post('/inspections', payload);
            notify(`Inspection submitted! ${result.work_tickets_created > 0 ? `${result.work_tickets_created} work ticket(s) created.` : ''}`);
            setPage('dashboard');
        } catch (e) {
            notify('Failed to submit: ' + e.message, 'error');
        }
        setSubmitting(false);
    };

    // Step 1: Select Equipment
    if (step === 1) {
        const fieldEquip = equipment.filter(e => e.category === 'field');
        const shopEquip = equipment.filter(e => e.category === 'shop');

        return (
            <div className="space-y-6">
                <h2 className="text-2xl font-bold text-sse-navy">New Inspection — Select Equipment</h2>

                {fieldEquip.length > 0 && (
                    <div>
                        <h3 className="text-lg font-semibold text-gray-700 mb-3">🏗️ Field Equipment</h3>
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                            {fieldEquip.map(eq => {
                                const display = getEquipmentDisplay(eq.equipment_type);
                                return (
                                    <button key={eq.id} onClick={() => { setSelectedEquip(eq); setStep(2); }}
                                        className="bg-white rounded-xl border-2 border-gray-200 hover:border-sse-orange p-4 text-left transition-all hover:shadow-md">
                                        <div className="flex items-center gap-3">
                                            <span className="text-3xl">{display.icon}</span>
                                            <div>
                                                <p className="font-bold text-lg">{getEquipmentNickname(eq)}</p>
                                                <p className="text-sm text-gray-500">{eq.make} {eq.model} — {eq.capacity}</p>
                                                <p className="text-xs text-gray-400">{eq.equipment_id}</p>
                                            </div>
                                        </div>
                                    </button>
                                );
                            })}
                        </div>
                    </div>
                )}

                {shopEquip.length > 0 && (
                    <div>
                        <h3 className="text-lg font-semibold text-gray-700 mb-3">⚙️ Shop Equipment</h3>
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                            {shopEquip.map(eq => {
                                const display = getEquipmentDisplay(eq.equipment_type);
                                return (
                                    <button key={eq.id} onClick={() => { setSelectedEquip(eq); setStep(2); }}
                                        className="bg-white rounded-xl border-2 border-gray-200 hover:border-sse-orange p-4 text-left transition-all hover:shadow-md">
                                        <div className="flex items-center gap-3">
                                            <span className="text-3xl">{display.icon}</span>
                                            <div>
                                                <p className="font-bold text-lg">{getEquipmentNickname(eq)}</p>
                                                <p className="text-sm text-gray-500">{eq.make} {eq.model}</p>
                                                <p className="text-xs text-gray-400">{eq.equipment_id}</p>
                                            </div>
                                        </div>
                                    </button>
                                );
                            })}
                        </div>
                    </div>
                )}
            </div>
        );
    }

    // Step 2: Select Inspection Type
    if (step === 2) {
        const checklists = getChecklistForEquipment(selectedEquip.equipment_type);
        const types = [
            { key: 'daily', label: 'Daily Inspection', desc: 'Pre-operation safety checks', color: 'blue', items: checklists.daily.sections.reduce((a, s) => a + s.items.length, 0) },
            { key: 'weekly', label: 'Weekly Inspection', desc: 'Detailed maintenance checks', color: 'purple', items: checklists.weekly.sections.reduce((a, s) => a + s.items.length, 0) },
            { key: 'monthly', label: 'Monthly Inspection', desc: 'Comprehensive review', color: 'green', items: checklists.monthly.sections.reduce((a, s) => a + s.items.length, 0) },
        ];

        return (
            <div className="space-y-6">
                <button onClick={() => setStep(1)} className="text-gray-500 hover:text-sse-navy flex items-center gap-1 text-sm">
                    ← Back to Equipment
                </button>
                <h2 className="text-2xl font-bold text-sse-navy">
                    {getEquipmentNickname(selectedEquip)} — Select Inspection Type
                </h2>
                <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                    {types.map(t => (
                        <button key={t.key} onClick={() => { setInspType(t.key); setStep(3); }}
                            className="bg-white rounded-xl border-2 border-gray-200 hover:border-sse-orange p-6 text-left transition-all hover:shadow-md">
                            <h3 className="text-xl font-bold mb-2">{t.label}</h3>
                            <p className="text-sm text-gray-500 mb-3">{t.desc}</p>
                            <p className="text-xs text-gray-400">{t.items} inspection items</p>
                        </button>
                    ))}
                </div>
            </div>
        );
    }

    // Step 3: Inspection Form
    if (step === 3) {
        const checklists = getChecklistForEquipment(selectedEquip.equipment_type);
        const checklist = checklists[inspType];
        const totalItems = checklist.sections.reduce((a, s) => a + s.items.length, 0);
        const checkedItems = Object.values(formData).filter(i => i.status !== '').length;
        const progress = totalItems > 0 ? Math.round((checkedItems / totalItems) * 100) : 0;

        return (
            <div className="space-y-6">
                <button onClick={() => { setStep(2); setInspType(null); setOverallStatus(''); }} className="text-gray-500 hover:text-sse-navy flex items-center gap-1 text-sm">
                    ← Back to Type Selection
                </button>

                {/* Header */}
                <div className="bg-white rounded-xl shadow-sm border p-4">
                    <h2 className="text-xl font-bold text-sse-navy">{checklist.title}</h2>
                    <p className="text-sm text-gray-500">{getEquipmentNickname(selectedEquip)} ({selectedEquip.equipment_id})</p>
                    {checklist.subtitle && <p className="text-xs text-gray-400 mt-1">{checklist.subtitle}</p>}
                    {checklist.warning && (
                        <div className="mt-2 bg-red-50 border border-red-200 rounded-lg p-2 text-red-700 text-sm font-medium">
                            ⚠️ {checklist.warning}
                        </div>
                    )}
                </div>

                {/* Progress Bar */}
                <div className="bg-white rounded-xl shadow-sm border p-4">
                    <div className="flex justify-between text-sm mb-1">
                        <span className="font-medium">Progress</span>
                        <span className="text-gray-500">{checkedItems} / {totalItems} items ({progress}%)</span>
                    </div>
                    <div className="w-full bg-gray-200 rounded-full h-3">
                        <div className="bg-sse-orange h-3 rounded-full transition-all duration-300" style={{ width: `${progress}%` }}></div>
                    </div>
                </div>

                {/* Inspector Info */}
                <div className="bg-white rounded-xl shadow-sm border p-4">
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div>
                            <label className="block text-sm font-medium text-gray-700 mb-1">Inspector Name *</label>
                            <input type="text" value={inspectorName} onChange={e => setInspectorName(e.target.value)}
                                className="w-full border rounded-lg px-3 py-2 text-sm" placeholder="Your name" />
                        </div>
                        <div>
                            <label className="block text-sm font-medium text-gray-700 mb-1">Hour Meter / Run Time</label>
                            <input type="number" value={hourMeter} onChange={e => setHourMeter(e.target.value)}
                                className="w-full border rounded-lg px-3 py-2 text-sm" placeholder="Reading" />
                        </div>
                        <div>
                            <label className="block text-sm font-medium text-gray-700 mb-1">Date</label>
                            <input type="text" readOnly value={new Date().toLocaleDateString()}
                                className="w-full border rounded-lg px-3 py-2 text-sm bg-gray-50" />
                        </div>
                    </div>
                </div>

                {/* Checklist Sections */}
                {checklist.sections.map((section, si) => (
                    <div key={si} className="bg-white rounded-xl shadow-sm border overflow-hidden">
                        <div className="bg-sse-navy text-white px-4 py-3">
                            <h3 className="font-bold text-sm">{section.name}</h3>
                        </div>
                        <div className="divide-y">
                            {section.items.map((item, ii) => {
                                const key = `${section.name}|||${item}`;
                                const val = formData[key] || { status: '', comments: '' };
                                return (
                                    <div key={ii} className={`p-3 ${val.status === 'needs_attention' ? 'bg-red-50' : ''}`}>
                                        <div className="flex items-start gap-3">
                                            <div className="flex-1">
                                                <p className="text-sm font-medium text-gray-800">{item}</p>
                                            </div>
                                            <div className="flex gap-1 shrink-0">
                                                <button onClick={() => setItemStatus(key, 'ok')}
                                                    className={`px-3 py-1 rounded text-xs font-bold transition-colors ${
                                                        val.status === 'ok' ? 'bg-green-600 text-white' : 'bg-gray-100 text-gray-500 hover:bg-green-100'
                                                    }`}>OK</button>
                                                <button onClick={() => setItemStatus(key, 'needs_attention')}
                                                    className={`px-3 py-1 rounded text-xs font-bold transition-colors ${
                                                        val.status === 'needs_attention' ? 'bg-red-600 text-white' : 'bg-gray-100 text-gray-500 hover:bg-red-100'
                                                    }`}>ATTN</button>
                                                <button onClick={() => setItemStatus(key, 'na')}
                                                    className={`px-3 py-1 rounded text-xs font-bold transition-colors ${
                                                        val.status === 'na' ? 'bg-gray-600 text-white' : 'bg-gray-100 text-gray-500 hover:bg-gray-200'
                                                    }`}>N/A</button>
                                            </div>
                                        </div>
                                        {val.status === 'needs_attention' && (
                                            <div className="mt-2">
                                                <input type="text" placeholder="Describe the issue..."
                                                    value={val.comments} onChange={e => setItemComment(key, e.target.value)}
                                                    className="w-full border border-red-300 rounded px-3 py-1.5 text-sm bg-white" />
                                            </div>
                                        )}
                                    </div>
                                );
                            })}
                        </div>
                    </div>
                ))}

                {/* General Comments */}
                <div className="bg-white rounded-xl shadow-sm border p-4">
                    <label className="block text-sm font-medium text-gray-700 mb-1">General Comments</label>
                    <textarea value={generalComments} onChange={e => setGeneralComments(e.target.value)}
                        className="w-full border rounded-lg px-3 py-2 text-sm" rows="3" placeholder="Any additional notes..." />
                </div>

                {/* Overall Status Selection */}
                <div className="bg-white rounded-xl shadow-sm border p-4">
                    <label className="block text-sm font-medium text-gray-700 mb-3">Overall Equipment Status *</label>
                    <div className="flex gap-4">
                        <button type="button" onClick={() => setOverallStatus('safe')}
                            className={`flex-1 py-4 rounded-xl font-bold text-lg transition-all border-2 ${
                                overallStatus === 'safe' 
                                    ? 'bg-green-600 text-white border-green-600' 
                                    : 'bg-white text-green-700 border-green-300 hover:border-green-500'
                            }`}>
                            ✅ SAFE TO OPERATE
                        </button>
                        <button type="button" onClick={() => setOverallStatus('needs_repair')}
                            className={`flex-1 py-4 rounded-xl font-bold text-lg transition-all border-2 ${
                                overallStatus === 'needs_repair' 
                                    ? 'bg-yellow-500 text-white border-yellow-500' 
                                    : 'bg-white text-yellow-700 border-yellow-300 hover:border-yellow-500'
                            }`}>
                            ⚠️ NEEDS REPAIR
                        </button>
                        <button type="button" onClick={() => setOverallStatus('out_of_service')}
                            className={`flex-1 py-4 rounded-xl font-bold text-lg transition-all border-2 ${
                                overallStatus === 'out_of_service' 
                                    ? 'bg-red-600 text-white border-red-600' 
                                    : 'bg-white text-red-700 border-red-300 hover:border-red-500'
                            }`}>
                            🚫 OUT OF SERVICE
                        </button>
                    </div>
                </div>

                {/* Submit */}
                <div className="bg-white rounded-xl shadow-sm border p-4 flex items-center justify-between">
                    <div>
                        <p className="text-sm text-gray-500">{checkedItems} / {totalItems} items checked</p>
                        {Object.values(formData).some(i => i.status === 'needs_attention') && (
                            <p className="text-sm text-red-600 font-medium">
                                ⚠️ {Object.values(formData).filter(i => i.status === 'needs_attention').length} item(s) need attention — work tickets will be auto-created
                            </p>
                        )}
                    </div>
                    <button onClick={handleSubmit} disabled={submitting || !allItemsChecked() || !inspectorName.trim() || !overallStatus}
                        className={`px-6 py-3 rounded-xl font-bold text-white transition-colors ${
                            submitting || !allItemsChecked() || !inspectorName.trim() || !overallStatus
                                ? 'bg-gray-400 cursor-not-allowed' : 'bg-sse-orange hover:bg-orange-600'
                        }`}>
                        {submitting ? 'Submitting...' : 'Submit Inspection'}
                    </button>
                </div>
            </div>
        );
    }
}

// =============================================================================
// HISTORY PAGE
// =============================================================================
function HistoryPage({ equipment, notify }) {
    const [inspections, setInspections] = useState([]);
    const [tickets, setTickets] = useState([]);
    const [loading, setLoading] = useState(true);
    const [selected, setSelected] = useState(null);
    const [detail, setDetail] = useState(null);

    const loadData = () => {
        setLoading(true);
        Promise.all([
            API.get('/inspections?limit=100'),
            API.get('/work-tickets?status=all').catch(() => API.get('/work-tickets').catch(() => []))
        ]).then(([insp, tix]) => {
            setInspections(insp);
            setTickets(Array.isArray(tix) ? tix : []);
        }).catch(console.error).finally(() => setLoading(false));
    };

    useEffect(() => { loadData(); }, []);

    const deleteInspection = async (id) => {
        if (!confirm('Delete this inspection? This cannot be undone.')) return;
        try {
            await API.del(`/inspections/${id}`);
            notify('Inspection deleted');
            setDetail(null);
            setSelected(null);
            loadData();
        } catch (e) { notify('Failed to delete: ' + e.message, 'error'); }
    };

    // For a given inspection, determine repair status
    const getRepairStatus = (insp) => {
        if (insp.overall_status === 'safe') return { status: 'safe', label: 'SAFE', color: 'bg-green-100 text-green-700' };
        if (insp.overall_status === 'out_of_service') return { status: 'out_of_service', label: 'OUT OF SERVICE', color: 'bg-red-100 text-red-700' };
        // Find work tickets linked to this inspection
        const related = tickets.filter(t => t.inspection_id === insp.id);
        if (related.length === 0) return { status: 'needs_repair', label: 'NEEDS REPAIR', color: 'bg-yellow-100 text-yellow-700' };
        const allCompleted = related.every(t => t.status === 'completed');
        if (allCompleted) {
            // Find the latest completion date
            const completedDates = related.map(t => t.completed_at).filter(Boolean);
            let latestDate = '';
            if (completedDates.length > 0) {
                const latest = new Date(Math.max(...completedDates.map(d => new Date(d))));
                latestDate = latest.toLocaleDateString();
            }
            return { status: 'repaired', label: `REPAIRED${latestDate ? ' — ' + latestDate : ''}`, color: 'bg-green-100 text-green-700' };
        }
        const completedCount = related.filter(t => t.status === 'completed').length;
        if (completedCount > 0) {
            return { status: 'partial', label: `${completedCount}/${related.length} REPAIRED`, color: 'bg-orange-100 text-orange-700' };
        }
        return { status: 'needs_repair', label: 'NEEDS REPAIR', color: 'bg-yellow-100 text-yellow-700' };
    };

    const viewDetail = async (id) => {
        try {
            const data = await API.get(`/inspections/${id}`);
            setDetail(data);
            setSelected(id);
        } catch (e) { console.error(e); }
    };

    if (loading) return <LoadingSpinner />;

    if (detail) {
        const failedItems = (detail.items || []).filter(i => i.status === 'needs_attention');
        const relatedTickets = tickets.filter(t => t.inspection_id === detail.id);
        const allTicketsCompleted = relatedTickets.length > 0 && relatedTickets.every(t => t.status === 'completed');
        
        return (
            <div className="space-y-4">
                <div className="flex items-center justify-between">
                    <button onClick={() => { setDetail(null); setSelected(null); }} className="text-gray-500 hover:text-sse-navy flex items-center gap-1 text-sm">
                        ← Back to History
                    </button>
                    <button onClick={() => deleteInspection(detail.id)} className="px-3 py-1.5 bg-red-100 text-red-600 text-sm rounded-lg hover:bg-red-200">
                        🗑️ Delete Inspection
                    </button>
                </div>
                <div className="bg-white rounded-xl shadow-sm border p-6">
                    <div className="flex items-center justify-between mb-4">
                        <div>
                            <h2 className="text-xl font-bold text-sse-navy capitalize">{detail.inspection_type} Inspection</h2>
                            <p className="text-gray-500">{detail.equipment_code} — {detail.inspection_date}</p>
                            <p className="text-sm text-gray-400">Inspector: {detail.inspector_name}</p>
                            {detail.hour_meter_reading && <p className="text-sm text-gray-400">Hour Meter: {detail.hour_meter_reading}</p>}
                        </div>
                        {(() => {
                            const rs = getRepairStatus(detail);
                            return <span className={`px-4 py-2 rounded-full text-sm font-bold ${rs.color}`}>{rs.label}</span>;
                        })()}
                    </div>
                    
                    {/* Repair Summary - shows when work tickets exist */}
                    {relatedTickets.length > 0 && (
                        <div className={`rounded-lg p-4 mb-4 ${allTicketsCompleted ? 'bg-green-50 border border-green-200' : 'bg-yellow-50 border border-yellow-200'}`}>
                            <h3 className={`font-bold mb-2 ${allTicketsCompleted ? 'text-green-700' : 'text-yellow-700'}`}>
                                {allTicketsCompleted ? '✅ All Repairs Completed' : '⏳ Repairs In Progress'}
                            </h3>
                            <div className="space-y-2">
                                {relatedTickets.map((ticket, i) => (
                                    <div key={i} className={`p-3 rounded ${ticket.status === 'completed' ? 'bg-green-100' : 'bg-yellow-100'}`}>
                                        <div className="flex items-center justify-between">
                                            <div>
                                                <p className="font-medium text-sm">{ticket.title}</p>
                                                {ticket.description && <p className="text-xs text-gray-600">{ticket.description}</p>}
                                            </div>
                                            <div className="text-right">
                                                {ticket.status === 'completed' ? (
                                                    <div>
                                                        <span className="px-2 py-1 bg-green-600 text-white text-xs font-bold rounded">COMPLETED</span>
                                                        <p className="text-xs text-green-700 mt-1">By: {ticket.completed_by}</p>
                                                        <p className="text-xs text-green-600">{new Date(ticket.completed_at).toLocaleDateString()} {new Date(ticket.completed_at).toLocaleTimeString()}</p>
                                                    </div>
                                                ) : (
                                                    <span className="px-2 py-1 bg-yellow-500 text-white text-xs font-bold rounded">OPEN</span>
                                                )}
                                            </div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}
                    
                    {detail.general_comments && (
                        <div className="bg-gray-50 rounded-lg p-3 mb-4">
                            <p className="text-sm text-gray-700"><strong>Comments:</strong> {detail.general_comments}</p>
                        </div>
                    )}
                    {failedItems.length > 0 && (
                        <div className="mb-4">
                            <h3 className="font-bold text-red-700 mb-2">⚠️ Items Needing Attention ({failedItems.length})</h3>
                            <div className="space-y-2">
                                {failedItems.map((item, i) => {
                                    // Find matching work ticket by inspection_id
                                    const matchTicket = relatedTickets.find(t => 
                                        t.title && t.title.includes(item.item_name?.substring(0, 30))
                                    );
                                    const isFixed = matchTicket && matchTicket.status === 'completed';
                                    return (
                                        <div key={i} className={`border rounded-lg p-3 ${isFixed ? 'bg-green-50 border-green-200' : 'bg-red-50 border-red-200'}`}>
                                            <div className="flex items-start justify-between">
                                                <div>
                                                    <p className={`font-medium ${isFixed ? 'text-green-800' : 'text-red-800'}`}>
                                                        {isFixed ? '✅ ' : ''}{item.item_name}
                                                    </p>
                                                    <p className={`text-sm ${isFixed ? 'text-green-600' : 'text-red-600'}`}>{item.category}</p>
                                                    {item.comments && <p className={`text-sm mt-1 ${isFixed ? 'text-green-700' : 'text-red-700'}`}>{item.comments}</p>}
                                                </div>
                                                {isFixed && matchTicket && (
                                                    <div className="text-right shrink-0 ml-3">
                                                        <span className="px-2 py-1 bg-green-600 text-white text-xs font-bold rounded">REPAIRED</span>
                                                        <p className="text-xs text-green-600 mt-1">By: {matchTicket.completed_by}</p>
                                                        <p className="text-xs text-green-500">{new Date(matchTicket.completed_at).toLocaleDateString()}</p>
                                                    </div>
                                                )}
                                                {!isFixed && matchTicket && (
                                                    <div className="text-right shrink-0 ml-3">
                                                        <span className="px-2 py-1 bg-yellow-500 text-white text-xs font-bold rounded">OPEN</span>
                                                    </div>
                                                )}
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                        </div>
                    )}
                    {/* All Items by Category */}
                    {(() => {
                        const grouped = {};
                        (detail.items || []).forEach(item => {
                            if (!grouped[item.category]) grouped[item.category] = [];
                            grouped[item.category].push(item);
                        });
                        return Object.entries(grouped).map(([cat, items]) => (
                            <div key={cat} className="mb-3">
                                <h4 className="font-bold text-sm text-sse-navy bg-gray-100 px-3 py-2 rounded-t-lg">{cat}</h4>
                                <div className="border border-t-0 rounded-b-lg divide-y">
                                    {items.map((item, i) => (
                                        <div key={i} className="flex items-center justify-between px-3 py-2 text-sm">
                                            <span>{item.item_name}</span>
                                            <span className={`px-2 py-0.5 rounded text-xs font-bold ${
                                                item.status === 'ok' ? 'status-ok' :
                                                item.status === 'needs_attention' ? 'status-attn' : 'status-na'
                                            }`}>{item.status === 'ok' ? 'OK' : item.status === 'needs_attention' ? 'ATTN' : 'N/A'}</span>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        ));
                    })()}
                </div>
            </div>
        );
    }

    return (
        <div className="space-y-4">
            <h2 className="text-2xl font-bold text-sse-navy">Inspection History</h2>
            {inspections.length === 0 ? (
                <div className="bg-white rounded-xl border p-8 text-center text-gray-500">No inspections recorded yet.</div>
            ) : (
                <div className="bg-white rounded-xl shadow-sm border overflow-hidden">
                    <table className="w-full text-sm">
                        <thead className="bg-gray-50 border-b">
                            <tr>
                                <th className="px-4 py-3 text-left font-medium text-gray-600">Equipment</th>
                                <th className="px-4 py-3 text-left font-medium text-gray-600">Type</th>
                                <th className="px-4 py-3 text-left font-medium text-gray-600">Date</th>
                                <th className="px-4 py-3 text-left font-medium text-gray-600">Inspector</th>
                                <th className="px-4 py-3 text-left font-medium text-gray-600">Status</th>
                                <th className="px-4 py-3 text-left font-medium text-gray-600"></th>
                            </tr>
                        </thead>
                        <tbody className="divide-y">
                            {inspections.map(insp => {
                                const rs = getRepairStatus(insp);
                                return (
                                <tr key={insp.id} className="hover:bg-gray-50">
                                    <td className="px-4 py-3 font-medium">{insp.equipment_code}</td>
                                    <td className="px-4 py-3 capitalize">{insp.inspection_type}</td>
                                    <td className="px-4 py-3">{insp.inspection_date}</td>
                                    <td className="px-4 py-3">{insp.inspector_name}</td>
                                    <td className="px-4 py-3">
                                        <span className={`px-2 py-0.5 rounded-full text-xs font-bold ${rs.color}`}>{rs.label}</span>
                                    </td>
                                    <td className="px-4 py-3">
                                        <div className="flex gap-2">
                                            <button onClick={() => viewDetail(insp.id)} className="text-sse-blue hover:underline text-sm">View</button>
                                            <button onClick={() => deleteInspection(insp.id)} className="text-red-500 hover:underline text-sm">Delete</button>
                                        </div>
                                    </td>
                                </tr>
                                );
                            })}
                        </tbody>
                    </table>
                </div>
            )}
        </div>
    );
}

// =============================================================================
// WORK TICKETS PAGE
// =============================================================================
function WorkTicketsPage({ notify }) {
    const [tickets, setTickets] = useState([]);
    const [loading, setLoading] = useState(true);
    const [filter, setFilter] = useState('open');

    const loadTickets = () => {
        setLoading(true);
        const url = filter === 'all' ? '/work-tickets' : `/work-tickets?status=${filter}`;
        API.get(url).then(setTickets).catch(console.error).finally(() => setLoading(false));
    };

    useEffect(() => { loadTickets(); }, [filter]);

    const completeTicket = async (id) => {
        const name = prompt('Completed by:');
        if (!name) return;
        try {
            await API.put(`/work-tickets/${id}`, { status: 'completed', completed_by: name });
            notify('Work ticket completed');
            loadTickets();
        } catch (e) { notify('Failed: ' + e.message, 'error'); }
    };

    const deleteTicket = async (id) => {
        if (!confirm('Delete this work ticket?')) return;
        try {
            await API.del(`/work-tickets/${id}`);
            notify('Work ticket deleted');
            loadTickets();
        } catch (e) { notify('Failed: ' + e.message, 'error'); }
    };

    if (loading) return <LoadingSpinner />;

    return (
        <div className="space-y-4">
            <div className="flex items-center justify-between">
                <h2 className="text-2xl font-bold text-sse-navy">Work Tickets</h2>
                <div className="flex gap-2">
                    {['open', 'completed', 'all'].map(f => (
                        <button key={f} onClick={() => setFilter(f)}
                            className={`px-4 py-2 rounded-lg text-sm font-medium transition-colors capitalize ${
                                filter === f ? 'bg-sse-navy text-white' : 'bg-white border text-gray-600 hover:bg-gray-50'
                            }`}>{f}</button>
                    ))}
                </div>
            </div>

            {tickets.length === 0 ? (
                <div className="bg-white rounded-xl border p-8 text-center text-gray-500">
                    No {filter !== 'all' ? filter : ''} work tickets.
                </div>
            ) : (
                <div className="space-y-3">
                    {tickets.map(ticket => (
                        <div key={ticket.id} className={`bg-white rounded-xl border p-4 ${
                            ticket.priority === 'high' ? 'border-l-4 border-l-red-500' : 'border-l-4 border-l-yellow-400'
                        }`}>
                            <div className="flex items-start justify-between">
                                <div>
                                    <div className="flex items-center gap-2 mb-1">
                                        <h3 className="font-bold">{ticket.title}</h3>
                                        <span className={`px-2 py-0.5 rounded text-xs font-bold ${
                                            ticket.priority === 'high' ? 'bg-red-100 text-red-700' : 'bg-yellow-100 text-yellow-700'
                                        }`}>{ticket.priority.toUpperCase()}</span>
                                        <span className={`px-2 py-0.5 rounded text-xs font-bold ${
                                            ticket.status === 'open' ? 'bg-blue-100 text-blue-700' : 'bg-green-100 text-green-700'
                                        }`}>{ticket.status.toUpperCase()}</span>
                                    </div>
                                    <p className="text-sm text-gray-500">{ticket.equipment_code} — {ticket.make} {ticket.model}</p>
                                    {ticket.description && <p className="text-sm text-gray-600 mt-1">{ticket.description}</p>}
                                    <p className="text-xs text-gray-400 mt-1">Created: {new Date(ticket.created_at).toLocaleDateString()}</p>
                                    {ticket.completed_by && (
                                        <div className="mt-1">
                                            <p className="text-xs text-green-600">✅ Completed by: {ticket.completed_by}</p>
                                            {ticket.completed_at && <p className="text-xs text-green-500">Repairs finished: {new Date(ticket.completed_at).toLocaleDateString()} at {new Date(ticket.completed_at).toLocaleTimeString()}</p>}
                                        </div>
                                    )}
                                </div>
                                {ticket.status === 'open' && (
                                    <div className="flex gap-2 shrink-0">
                                        <button onClick={() => completeTicket(ticket.id)}
                                            className="px-3 py-1.5 bg-green-600 text-white text-sm rounded-lg hover:bg-green-700">
                                            ✓ Complete
                                        </button>
                                        <button onClick={() => deleteTicket(ticket.id)}
                                            className="px-3 py-1.5 bg-red-100 text-red-600 text-sm rounded-lg hover:bg-red-200">
                                            Delete
                                        </button>
                                    </div>
                                )}
                            </div>
                        </div>
                    ))}
                </div>
            )}
        </div>
    );
}

// =============================================================================
// EQUIPMENT PAGE — Dynamic with all known types in dropdown
// =============================================================================
function EquipmentPage({ equipment, reload, notify }) {
    const [showAdd, setShowAdd] = useState(false);
    const [form, setForm] = useState({ equipment_id: '', equipment_type: 'telehandler_12k', category: 'field', make: '', model: '', serial_number: '', capacity: '' });

    // Auto-set category when equipment type changes
    const handleTypeChange = (newType) => {
        const typeInfo = EQUIPMENT_TYPE_OPTIONS.find(t => t.value === newType);
        setForm({ ...form, equipment_type: newType, category: typeInfo?.category || 'shop' });
    };

    const addEquipment = async () => {
        if (!form.equipment_id.trim()) { notify('Equipment ID required', 'error'); return; }
        try {
            await API.post('/equipment', form);
            notify('Equipment added');
            setShowAdd(false);
            setForm({ equipment_id: '', equipment_type: 'telehandler_12k', category: 'field', make: '', model: '', serial_number: '', capacity: '' });
            reload();
        } catch (e) { notify('Failed: ' + e.message, 'error'); }
    };

    const deactivate = async (id) => {
        if (!confirm('Deactivate this equipment?')) return;
        try {
            await API.del(`/equipment/${id}`);
            notify('Equipment deactivated');
            reload();
        } catch (e) { notify('Failed: ' + e.message, 'error'); }
    };

    return (
        <div className="space-y-4">
            <div className="flex items-center justify-between">
                <h2 className="text-2xl font-bold text-sse-navy">Equipment</h2>
                <button onClick={() => setShowAdd(!showAdd)}
                    className="px-4 py-2 bg-sse-orange text-white rounded-lg font-medium hover:bg-orange-600">
                    + Add Equipment
                </button>
            </div>

            {showAdd && (
                <div className="bg-white rounded-xl border p-4 space-y-3">
                    <h3 className="font-bold text-sse-navy">Add New Equipment</h3>
                    <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
                        <input type="text" placeholder="Equipment ID (e.g. CRANE-01)" value={form.equipment_id}
                            onChange={e => setForm({ ...form, equipment_id: e.target.value })}
                            className="border rounded-lg px-3 py-2 text-sm" />
                        <select value={form.equipment_type} onChange={e => handleTypeChange(e.target.value)}
                            className="border rounded-lg px-3 py-2 text-sm">
                            <optgroup label="Field Equipment">
                                {EQUIPMENT_TYPE_OPTIONS.filter(t => t.category === 'field').map(t => (
                                    <option key={t.value} value={t.value}>{t.label}</option>
                                ))}
                            </optgroup>
                            <optgroup label="Shop Equipment">
                                {EQUIPMENT_TYPE_OPTIONS.filter(t => t.category === 'shop').map(t => (
                                    <option key={t.value} value={t.value}>{t.label}</option>
                                ))}
                            </optgroup>
                        </select>
                        <select value={form.category} onChange={e => setForm({ ...form, category: e.target.value })}
                            className="border rounded-lg px-3 py-2 text-sm">
                            <option value="field">Field</option>
                            <option value="shop">Shop</option>
                        </select>
                        <input type="text" placeholder="Make" value={form.make}
                            onChange={e => setForm({ ...form, make: e.target.value })}
                            className="border rounded-lg px-3 py-2 text-sm" />
                        <input type="text" placeholder="Model" value={form.model}
                            onChange={e => setForm({ ...form, model: e.target.value })}
                            className="border rounded-lg px-3 py-2 text-sm" />
                        <input type="text" placeholder="Serial Number" value={form.serial_number}
                            onChange={e => setForm({ ...form, serial_number: e.target.value })}
                            className="border rounded-lg px-3 py-2 text-sm" />
                        <input type="text" placeholder="Capacity" value={form.capacity}
                            onChange={e => setForm({ ...form, capacity: e.target.value })}
                            className="border rounded-lg px-3 py-2 text-sm" />
                        <button onClick={addEquipment} className="bg-green-600 text-white rounded-lg px-4 py-2 text-sm font-medium hover:bg-green-700">Save</button>
                    </div>
                </div>
            )}

            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                {equipment.map(eq => {
                    const display = getEquipmentDisplay(eq.equipment_type);
                    return (
                        <div key={eq.id} className="bg-white rounded-xl border p-4">
                            <div className="flex items-start justify-between">
                                <div className="flex items-center gap-3">
                                    <span className="text-3xl">{display.icon}</span>
                                    <div>
                                        <p className="font-bold text-lg">{getEquipmentNickname(eq)}</p>
                                        <p className="text-sm text-gray-500">{eq.make} {eq.model}</p>
                                        <p className="text-xs text-gray-400">ID: {eq.equipment_id} {eq.serial_number ? `| S/N: ${eq.serial_number}` : ''}</p>
                                        <p className="text-xs text-gray-400">Category: {eq.category} {eq.capacity ? `| ${eq.capacity}` : ''}</p>
                                    </div>
                                </div>
                                <button onClick={() => deactivate(eq.id)} className="text-red-400 hover:text-red-600 text-sm">Deactivate</button>
                            </div>
                        </div>
                    );
                })}
            </div>
        </div>
    );
}

// =============================================================================
// SHARED COMPONENTS
// =============================================================================
function LoadingSpinner() {
    return (
        <div className="flex items-center justify-center py-12">
            <div className="w-10 h-10 border-4 border-sse-orange border-t-transparent rounded-full animate-spin"></div>
        </div>
    );
}

</script>
