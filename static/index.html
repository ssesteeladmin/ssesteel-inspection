    post: async (url, data) => { const r = await fetch('/api' + url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) }); if (!r.ok) { const e = await r.json().catch(() => ({})); throw new Error(e.detail || r.statusText); } return r.json(); },

                'Pulse settings (if used) — verify function',
                'All programs/presets — verify saved',
            ]},
        ]
    }
};

// Map equipment types to their checklist data
function getChecklistForEquipment(equipmentType) {
    if (equipmentType === 'telehandler_33k' || equipmentType === 'telehandler_12k') return TELEHANDLER_CHECKLISTS;
    if (equipmentType === 'emi_tube_cutter') return EMI_TUBE_CUTTER_CHECKLISTS;
    if (equipmentType === 'miller_welder') return MILLER_WELDER_CHECKLISTS;
    return TELEHANDLER_CHECKLISTS;
}

function App() {
    const [page, setPage] = useState('dashboard');
    const [equipment, setEquipment] = useState([]);
    const [loading, setLoading] = useState(true);
    const [notification, setNotification] = useState(null);

    const notify = (msg, type = 'success') => {
        setNotification({ msg, type });
        setTimeout(() => setNotification(null), 3000);
    };

    const loadEquipment = async () => {
        try {
            const data = await API.get('/equipment');
            setEquipment(data);
            return data;
        } catch (e) {
            console.error('Failed to load equipment:', e);
            return [];
        }
    };

    const seedEquipment = async () => {
        try {
            const existing = await loadEquipment();
            if (existing.length === 0) {
                for (const eq of EQUIPMENT_SEED) {
                    try { await API.post('/equipment', eq); } catch (e) { console.log('Seed skip:', eq.equipment_id); }
                }
                await loadEquipment();
                notify('Equipment seeded successfully');
            }
        } catch (e) { console.error('Seed failed:', e); }
        setLoading(false);
    };

    useEffect(() => { seedEquipment(); }, []);

    if (loading) return (
        <div className="min-h-screen flex items-center justify-center">
            <div className="text-center">
                <div className="w-12 h-12 border-4 border-sse-orange border-t-transparent rounded-full animate-spin mx-auto mb-4"></div>
                <p className="text-gray-600">Loading SSE Inspection System...</p>
            </div>
        </div>
    );

    return (
        <div className="min-h-screen">
            {/* Top Nav */}
            <nav className="bg-sse-navy text-white shadow-lg">
                <div className="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
                    <div className="flex items-center gap-3">
                        <div className="w-10 h-10 bg-sse-orange rounded-lg flex items-center justify-center font-bold text-lg">SSE</div>
                        <div>
                            <h1 className="text-lg font-bold leading-tight">Equipment Inspections</h1>
                            <p className="text-xs text-gray-400">Southern Services & Equipment</p>
                        </div>
                    </div>
                </div>
                <div className="max-w-7xl mx-auto px-4 flex gap-1 pb-1">
                    {[
                        { id: 'dashboard', label: 'Dashboard', icon: '📊' },
                        { id: 'new-inspection', label: 'New Inspection', icon: '📋' },
                        { id: 'history', label: 'History', icon: '📜' },
                        { id: 'work-tickets', label: 'Work Tickets', icon: '🔧' },
                        { id: 'equipment', label: 'Equipment', icon: '🏗️' },
                    ].map(tab => (
                        <button key={tab.id} onClick={() => setPage(tab.id)}
                            className={`px-4 py-2 rounded-t-lg text-sm font-medium transition-colors ${
                                page === tab.id ? 'bg-white text-sse-navy' : 'text-gray-300 hover:text-white hover:bg-white/10'
                            }`}>
                            <span className="mr-1">{tab.icon}</span> {tab.label}
                        </button>
                    ))}
                </div>
            </nav>

            {/* Notification */}
            {notification && (
                <div className={`fixed top-4 right-4 z-50 px-4 py-3 rounded-lg shadow-lg text-white font-medium ${
                    notification.type === 'success' ? 'bg-green-600' : notification.type === 'error' ? 'bg-red-600' : 'bg-blue-600'
                }`}>{notification.msg}</div>
            )}

            {/* Page Content */}
            <div className="max-w-7xl mx-auto px-4 py-6 fade-in">
                {page === 'dashboard' && <DashboardPage equipment={equipment} />}
                {page === 'new-inspection' && <NewInspectionPage equipment={equipment} notify={notify} setPage={setPage} />}
                {page === 'history' && <HistoryPage equipment={equipment} />}
                {page === 'work-tickets' && <WorkTicketsPage notify={notify} />}
                {page === 'equipment' && <EquipmentPage equipment={equipment} reload={loadEquipment} notify={notify} />}
            </div>
        </div>
    );
}

// NEW INSPECTION PAGE
// =============================================================================
function NewInspectionPage({ equipment, notify, setPage }) {
    const [step, setStep] = useState(1); // 1=select equipment, 2=select type, 3=fill form
    const [selectedEquip, setSelectedEquip] = useState(null);
    const [inspType, setInspType] = useState(null);
    const [formData, setFormData] = useState({});
    const [inspectorName, setInspectorName] = useState('');
    const [hourMeter, setHourMeter] = useState('');
    const [generalComments, setGeneralComments] = useState('');
    const [submitting, setSubmitting] = useState(false);

    // Initialize form data when checklist is selected
    useEffect(() => {
        if (selectedEquip && inspType) {
            const checklists = getChecklistForEquipment(selectedEquip.equipment_type);
            const checklist = checklists[inspType];
            const initial = {};
            checklist.sections.forEach(section => {
                section.items.forEach(item => {
                    const key = `${section.name}|||${item}`;
                    initial[key] = { status: '', comments: '' };
                });
            });
            setFormData(initial);
        }
    }, [selectedEquip, inspType]);

    const setItemStatus = (key, status) => {
        setFormData(prev => ({ ...prev, [key]: { ...prev[key], status } }));
    };

    const setItemComment = (key, comments) => {
        setFormData(prev => ({ ...prev, [key]: { ...prev[key], comments } }));
    };

    const allItemsChecked = () => {
        return Object.values(formData).every(item => item.status !== '');
    };

    const handleSubmit = async () => {
        if (!inspectorName.trim()) { notify('Please enter inspector name', 'error'); return; }
        if (!allItemsChecked()) { notify('Please check all items before submitting', 'error'); return; }

        setSubmitting(true);
        try {
            const items = Object.entries(formData).map(([key, val]) => {
                const [category, item_name] = key.split('|||');
                return { category, item_name, status: val.status, comments: val.comments || null };
            });

            const needsAttn = items.some(i => i.status === 'needs_attention');
            const overall = needsAttn ? 'needs_repair' : 'safe';

            const payload = {
                equipment_id: selectedEquip.id,
                inspection_type: inspType,
                inspection_date: new Date().toISOString().split('T')[0],
                inspector_name: inspectorName,
                hour_meter_reading: hourMeter ? parseInt(hourMeter) : null,
                overall_status: overall,
                general_comments: generalComments || null,
                items
            };

            const result = await API.post('/inspections', payload);
            notify(`Inspection submitted! ${result.work_tickets_created > 0 ? `${result.work_tickets_created} work ticket(s) created.` : ''}`);
            setPage('dashboard');
        } catch (e) {
            notify('Failed to submit: ' + e.message, 'error');
        }
        setSubmitting(false);
    };

    // Step 1: Select Equipment
    if (step === 1) {
        const fieldEquip = equipment.filter(e => e.category === 'field');
        const shopEquip = equipment.filter(e => e.category === 'shop');

        return (
            <div className="space-y-6">
                <h2 className="text-2xl font-bold text-sse-navy">New Inspection — Select Equipment</h2>

                {fieldEquip.length > 0 && (
                    <div>
                        <h3 className="text-lg font-semibold text-gray-700 mb-3">🏗️ Field Equipment</h3>
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                            {fieldEquip.map(eq => (
                                <button key={eq.id} onClick={() => { setSelectedEquip(eq); setStep(2); }}
                                    className="bg-white rounded-xl border-2 border-gray-200 hover:border-sse-orange p-4 text-left transition-all hover:shadow-md">
                                    <div className="flex items-center gap-3">
                                        <span className="text-3xl">{EQUIPMENT_DISPLAY[eq.equipment_type]?.icon || '📦'}</span>
                                        <div>
                                            <p className="font-bold text-lg">{getEquipmentNickname(eq)}</p>
                                            <p className="text-sm text-gray-500">{eq.make} {eq.model} — {eq.capacity}</p>
                                            <p className="text-xs text-gray-400">{eq.equipment_id}</p>
                                        </div>
                                    </div>
                                </button>
                            ))}
                        </div>
                    </div>
                )}

                {shopEquip.length > 0 && (
                    <div>
                        <h3 className="text-lg font-semibold text-gray-700 mb-3">⚙️ Shop Equipment</h3>
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                            {shopEquip.map(eq => (
                                <button key={eq.id} onClick={() => { setSelectedEquip(eq); setStep(2); }}
                                    className="bg-white rounded-xl border-2 border-gray-200 hover:border-sse-orange p-4 text-left transition-all hover:shadow-md">
                                    <div className="flex items-center gap-3">
                                        <span className="text-3xl">{EQUIPMENT_DISPLAY[eq.equipment_type]?.icon || '📦'}</span>
                                        <div>
                                            <p className="font-bold text-lg">{getEquipmentNickname(eq)}</p>
                                            <p className="text-sm text-gray-500">{eq.make} {eq.model}</p>
                                            <p className="text-xs text-gray-400">{eq.equipment_id}</p>
                                        </div>
                                    </div>
                                </button>
                            ))}
                        </div>
                    </div>
                )}
            </div>
        );
    }

    // Step 2: Select Inspection Type
    if (step === 2) {
        const checklists = getChecklistForEquipment(selectedEquip.equipment_type);
        const types = [
            { key: 'daily', label: 'Daily Inspection', desc: 'Pre-operation safety checks', color: 'blue', items: checklists.daily.sections.reduce((a, s) => a + s.items.length, 0) },
            { key: 'weekly', label: 'Weekly Inspection', desc: 'Detailed maintenance checks', color: 'purple', items: checklists.weekly.sections.reduce((a, s) => a + s.items.length, 0) },
            { key: 'monthly', label: 'Monthly Inspection', desc: 'Comprehensive review', color: 'green', items: checklists.monthly.sections.reduce((a, s) => a + s.items.length, 0) },
        ];

        return (
            <div className="space-y-6">
                <button onClick={() => setStep(1)} className="text-gray-500 hover:text-sse-navy flex items-center gap-1 text-sm">
                    ← Back to Equipment
                </button>
                <h2 className="text-2xl font-bold text-sse-navy">
                    {getEquipmentNickname(selectedEquip)} — Select Inspection Type
                </h2>
                <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                    {types.map(t => (
                        <button key={t.key} onClick={() => { setInspType(t.key); setStep(3); }}
                            className="bg-white rounded-xl border-2 border-gray-200 hover:border-sse-orange p-6 text-left transition-all hover:shadow-md">
                            <h3 className="text-xl font-bold mb-2">{t.label}</h3>
                            <p className="text-sm text-gray-500 mb-3">{t.desc}</p>
                            <p className="text-xs text-gray-400">{t.items} inspection items</p>
                        </button>
                    ))}
                </div>
            </div>
        );
    }

    // Step 3: Inspection Form
    if (step === 3) {
        const checklists = getChecklistForEquipment(selectedEquip.equipment_type);
        const checklist = checklists[inspType];
        const totalItems = checklist.sections.reduce((a, s) => a + s.items.length, 0);
        const checkedItems = Object.values(formData).filter(i => i.status !== '').length;
        const progress = totalItems > 0 ? Math.round((checkedItems / totalItems) * 100) : 0;

        return (
            <div className="space-y-6">
                <button onClick={() => { setStep(2); setInspType(null); }} className="text-gray-500 hover:text-sse-navy flex items-center gap-1 text-sm">
                    ← Back to Type Selection
                </button>

                {/* Header */}
                <div className="bg-white rounded-xl shadow-sm border p-4">
                    <h2 className="text-xl font-bold text-sse-navy">{checklist.title}</h2>
                    <p className="text-sm text-gray-500">{getEquipmentNickname(selectedEquip)} ({selectedEquip.equipment_id})</p>
                    {checklist.subtitle && <p className="text-xs text-gray-400 mt-1">{checklist.subtitle}</p>}
                    {checklist.warning && (
                        <div className="mt-2 bg-red-50 border border-red-200 rounded-lg p-2 text-red-700 text-sm font-medium">
                            ⚠️ {checklist.warning}
                        </div>
                    )}
                </div>

                {/* Progress Bar */}
                <div className="bg-white rounded-xl shadow-sm border p-4">
                    <div className="flex justify-between text-sm mb-1">
                        <span className="font-medium">Progress</span>
                        <span className="text-gray-500">{checkedItems} / {totalItems} items ({progress}%)</span>
                    </div>
                    <div className="w-full bg-gray-200 rounded-full h-3">
                        <div className="bg-sse-orange h-3 rounded-full transition-all duration-300" style={{ width: `${progress}%` }}></div>
                    </div>
                </div>

                {/* Inspector Info */}
                <div className="bg-white rounded-xl shadow-sm border p-4">
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div>
                            <label className="block text-sm font-medium text-gray-700 mb-1">Inspector Name *</label>
                            <input type="text" value={inspectorName} onChange={e => setInspectorName(e.target.value)}
                                className="w-full border rounded-lg px-3 py-2 text-sm" placeholder="Your name" />
                        </div>
                        <div>
                            <label className="block text-sm font-medium text-gray-700 mb-1">Hour Meter / Run Time</label>
                            <input type="number" value={hourMeter} onChange={e => setHourMeter(e.target.value)}
                                className="w-full border rounded-lg px-3 py-2 text-sm" placeholder="Reading" />
                        </div>
                        <div>
                            <label className="block text-sm font-medium text-gray-700 mb-1">Date</label>
                            <input type="text" readOnly value={new Date().toLocaleDateString()}
                                className="w-full border rounded-lg px-3 py-2 text-sm bg-gray-50" />
                        </div>
                    </div>
                </div>

                {/* Checklist Sections */}
                {checklist.sections.map((section, si) => (
                    <div key={si} className="bg-white rounded-xl shadow-sm border overflow-hidden">
                        <div className="bg-sse-navy text-white px-4 py-3">
                            <h3 className="font-bold text-sm">{section.name}</h3>
                        </div>
                        <div className="divide-y">
                            {section.items.map((item, ii) => {
                                const key = `${section.name}|||${item}`;
                                const val = formData[key] || { status: '', comments: '' };
                                return (
                                    <div key={ii} className={`p-3 ${val.status === 'needs_attention' ? 'bg-red-50' : ''}`}>
                                        <div className="flex items-start gap-3">
                                            <div className="flex-1">
                                                <p className="text-sm font-medium text-gray-800">{item}</p>
                                            </div>
                                            <div className="flex gap-1 shrink-0">
                                                <button onClick={() => setItemStatus(key, 'ok')}
                                                    className={`px-3 py-1 rounded text-xs font-bold transition-colors ${
                                                        val.status === 'ok' ? 'bg-green-600 text-white' : 'bg-gray-100 text-gray-500 hover:bg-green-100'
                                                    }`}>OK</button>
                                                <button onClick={() => setItemStatus(key, 'needs_attention')}
                                                    className={`px-3 py-1 rounded text-xs font-bold transition-colors ${
                                                        val.status === 'needs_attention' ? 'bg-red-600 text-white' : 'bg-gray-100 text-gray-500 hover:bg-red-100'
                                                    }`}>ATTN</button>
                                                <button onClick={() => setItemStatus(key, 'na')}
                                                    className={`px-3 py-1 rounded text-xs font-bold transition-colors ${
                                                        val.status === 'na' ? 'bg-gray-600 text-white' : 'bg-gray-100 text-gray-500 hover:bg-gray-200'
                                                    }`}>N/A</button>
                                            </div>
                                        </div>
                                        {val.status === 'needs_attention' && (
                                            <div className="mt-2">
                                                <input type="text" placeholder="Describe the issue..."
                                                    value={val.comments} onChange={e => setItemComment(key, e.target.value)}
                                                    className="w-full border border-red-300 rounded px-3 py-1.5 text-sm bg-white" />
                                            </div>
                                        )}
                                    </div>
                                );
                            })}
                        </div>
                    </div>
                ))}

                {/* General Comments */}
                <div className="bg-white rounded-xl shadow-sm border p-4">
                    <label className="block text-sm font-medium text-gray-700 mb-1">General Comments</label>
                    <textarea value={generalComments} onChange={e => setGeneralComments(e.target.value)}
                        className="w-full border rounded-lg px-3 py-2 text-sm" rows="3" placeholder="Any additional notes..." />
                </div>

                {/* Submit */}
                <div className="bg-white rounded-xl shadow-sm border p-4 flex items-center justify-between">
                    <div>
                        <p className="text-sm text-gray-500">{checkedItems} / {totalItems} items checked</p>
                        {Object.values(formData).some(i => i.status === 'needs_attention') && (
                            <p className="text-sm text-red-600 font-medium">
                                ⚠️ {Object.values(formData).filter(i => i.status === 'needs_attention').length} item(s) need attention — work tickets will be auto-created
                            </p>
                        )}
                    </div>
                    <button onClick={handleSubmit} disabled={submitting || !allItemsChecked() || !inspectorName.trim()}
                        className={`px-6 py-3 rounded-xl font-bold text-white transition-colors ${
                            submitting || !allItemsChecked() || !inspectorName.trim()
                                ? 'bg-gray-400 cursor-not-allowed' : 'bg-sse-orange hover:bg-orange-600'
                        }`}>
                        {submitting ? 'Submitting...' : 'Submit Inspection'}
                    </button>
                </div>
            </div>
        );
    }
}

                            <p className="text-gray-500">{detail.equipment_code} — {detail.inspection_date}</p>
                            <p className="text-sm text-gray-400">Inspector: {detail.inspector_name}</p>
                            {detail.hour_meter_reading && <p className="text-sm text-gray-400">Hour Meter: {detail.hour_meter_reading}</p>}
                        </div>
                        <span className={`px-4 py-2 rounded-full text-sm font-bold ${
                            detail.overall_status === 'safe' ? 'bg-green-100 text-green-700' :
                            detail.overall_status === 'needs_repair' ? 'bg-yellow-100 text-yellow-700' :
                            'bg-red-100 text-red-700'
                        }`}>{detail.overall_status === 'safe' ? 'SAFE' : detail.overall_status === 'needs_repair' ? 'NEEDS REPAIR' : 'OUT OF SERVICE'}</span>
                    </div>
                    {detail.general_comments && (
                        <div className="bg-gray-50 rounded-lg p-3 mb-4">
                            <p className="text-sm text-gray-700"><strong>Comments:</strong> {detail.general_comments}</p>
                        </div>
                    )}
                    {failedItems.length > 0 && (
                        <div className="mb-4">
                            <h3 className="font-bold text-red-700 mb-2">⚠️ Items Needing Attention ({failedItems.length})</h3>
                            <div className="space-y-2">
                                {failedItems.map((item, i) => (
                                    <div key={i} className="bg-red-50 border border-red-200 rounded-lg p-3">
                                        <p className="font-medium text-red-800">{item.item_name}</p>
                                        <p className="text-sm text-red-600">{item.category}</p>
                                        {item.comments && <p className="text-sm text-red-700 mt-1">{item.comments}</p>}
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}
                    {/* All Items by Category */}
                    {(() => {
                        const grouped = {};
                        (detail.items || []).forEach(item => {
                            if (!grouped[item.category]) grouped[item.category] = [];
                            grouped[item.category].push(item);
                        });
                        return Object.entries(grouped).map(([cat, items]) => (
                            <div key={cat} className="mb-3">
                                <h4 className="font-bold text-sm text-sse-navy bg-gray-100 px-3 py-2 rounded-t-lg">{cat}</h4>
                                <div className="border border-t-0 rounded-b-lg divide-y">
                                    {items.map((item, i) => (
                                        <div key={i} className="flex items-center justify-between px-3 py-2 text-sm">
                                            <span>{item.item_name}</span>
                                            <span className={`px-2 py-0.5 rounded text-xs font-bold ${
                                                item.status === 'ok' ? 'status-ok' :
                                                item.status === 'needs_attention' ? 'status-attn' : 'status-na'
                                            }`}>{item.status === 'ok' ? 'OK' : item.status === 'needs_attention' ? 'ATTN' : 'N/A'}</span>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        ));
                    })()}
                </div>
            </div>
        );
    }

    return (
        <div className="space-y-4">
            <h2 className="text-2xl font-bold text-sse-navy">Inspection History</h2>
            {inspections.length === 0 ? (
                <div className="bg-white rounded-xl border p-8 text-center text-gray-500">No inspections recorded yet.</div>
            ) : (
                <div className="bg-white rounded-xl shadow-sm border overflow-hidden">
                    <table className="w-full text-sm">
                        <thead className="bg-gray-50 border-b">
                            <tr>
                                <th className="px-4 py-3 text-left font-medium text-gray-600">Equipment</th>
                                <th className="px-4 py-3 text-left font-medium text-gray-600">Type</th>
                                <th className="px-4 py-3 text-left font-medium text-gray-600">Date</th>
                                <th className="px-4 py-3 text-left font-medium text-gray-600">Inspector</th>
                                <th className="px-4 py-3 text-left font-medium text-gray-600">Status</th>
                                <th className="px-4 py-3 text-left font-medium text-gray-600"></th>
                            </tr>
                        </thead>
                        <tbody className="divide-y">
                            {inspections.map(insp => (
                                <tr key={insp.id} className="hover:bg-gray-50">
                                    <td className="px-4 py-3 font-medium">{insp.equipment_code}</td>
                                    <td className="px-4 py-3 capitalize">{insp.inspection_type}</td>
                                    <td className="px-4 py-3">{insp.inspection_date}</td>
                                    <td className="px-4 py-3">{insp.inspector_name}</td>
                                    <td className="px-4 py-3">
                                        <span className={`px-2 py-0.5 rounded-full text-xs font-bold ${
                                            insp.overall_status === 'safe' ? 'bg-green-100 text-green-700' :
                                            insp.overall_status === 'needs_repair' ? 'bg-yellow-100 text-yellow-700' :
                                            'bg-red-100 text-red-700'
                                        }`}>{insp.overall_status === 'safe' ? 'SAFE' : 'NEEDS REPAIR'}</span>
                                    </td>
                                    <td className="px-4 py-3">
                                        <button onClick={() => viewDetail(insp.id)} className="text-sse-blue hover:underline text-sm">View</button>
                                    </td>
                                </tr>
                            ))}
                        </tbody>
                    </table>
                </div>
            )}
        </div>
    );
}

// =============================================================================
// WORK TICKETS PAGE
// =============================================================================
function WorkTicketsPage({ notify }) {
    const [tickets, setTickets] = useState([]);
    const [loading, setLoading] = useState(true);
    const [filter, setFilter] = useState('open');

    const loadTickets = () => {
        setLoading(true);
        const url = filter === 'all' ? '/work-tickets' : `/work-tickets?status=${filter}`;
        API.get(url).then(setTickets).catch(console.error).finally(() => setLoading(false));
    };

    useEffect(() => { loadTickets(); }, [filter]);

    const completeTicket = async (id) => {
        const name = prompt('Completed by:');
        if (!name) return;
        try {
            await API.put(`/work-tickets/${id}`, { status: 'completed', completed_by: name });
            notify('Work ticket completed');
            loadTickets();
        } catch (e) { notify('Failed: ' + e.message, 'error'); }
    };

    const deleteTicket = async (id) => {
        if (!confirm('Delete this work ticket?')) return;
        try {
            await API.del(`/work-tickets/${id}`);
            notify('Work ticket deleted');
            loadTickets();
        } catch (e) { notify('Failed: ' + e.message, 'error'); }
    };

    if (loading) return <LoadingSpinner />;

    return (
        <div className="space-y-4">
            <div className="flex items-center justify-between">
                <h2 className="text-2xl font-bold text-sse-navy">Work Tickets</h2>
                <div className="flex gap-2">
                    {['open', 'completed', 'all'].map(f => (
                        <button key={f} onClick={() => setFilter(f)}
                            className={`px-4 py-2 rounded-lg text-sm font-medium transition-colors capitalize ${
                                filter === f ? 'bg-sse-navy text-white' : 'bg-white border text-gray-600 hover:bg-gray-50'
                            }`}>{f}</button>
                    ))}
                </div>
            </div>

            {tickets.length === 0 ? (
                <div className="bg-white rounded-xl border p-8 text-center text-gray-500">
                    No {filter !== 'all' ? filter : ''} work tickets.
                </div>
            ) : (
                <div className="space-y-3">
                    {tickets.map(ticket => (
                        <div key={ticket.id} className={`bg-white rounded-xl border p-4 ${
                            ticket.priority === 'high' ? 'border-l-4 border-l-red-500' : 'border-l-4 border-l-yellow-400'
                        }`}>
                            <div className="flex items-start justify-between">
                                <div>
                                    <div className="flex items-center gap-2 mb-1">
                                        <h3 className="font-bold">{ticket.title}</h3>
                                        <span className={`px-2 py-0.5 rounded text-xs font-bold ${
                                            ticket.priority === 'high' ? 'bg-red-100 text-red-700' : 'bg-yellow-100 text-yellow-700'
                                        }`}>{ticket.priority.toUpperCase()}</span>
                                        <span className={`px-2 py-0.5 rounded text-xs font-bold ${
                                            ticket.status === 'open' ? 'bg-blue-100 text-blue-700' : 'bg-green-100 text-green-700'
                                        }`}>{ticket.status.toUpperCase()}</span>
                                    </div>
                                    <p className="text-sm text-gray-500">{ticket.equipment_code} — {ticket.make} {ticket.model}</p>
                                    {ticket.description && <p className="text-sm text-gray-600 mt-1">{ticket.description}</p>}
                                    <p className="text-xs text-gray-400 mt-1">Created: {new Date(ticket.created_at).toLocaleDateString()}</p>
                                    {ticket.completed_by && <p className="text-xs text-green-600 mt-1">Completed by: {ticket.completed_by}</p>}
                                </div>
                                {ticket.status === 'open' && (
                                    <div className="flex gap-2 shrink-0">
                                        <button onClick={() => completeTicket(ticket.id)}
                                            className="px-3 py-1.5 bg-green-600 text-white text-sm rounded-lg hover:bg-green-700">
                                            ✓ Complete
                                        </button>
                                        <button onClick={() => deleteTicket(ticket.id)}
                                            className="px-3 py-1.5 bg-red-100 text-red-600 text-sm rounded-lg hover:bg-red-200">
                                            Delete
                                        </button>
                                    </div>
                                )}
                            </div>
                        </div>
                    ))}
                </div>
            )}
        </div>
    );
}

// =============================================================================
// EQUIPMENT PAGE
// =============================================================================
function EquipmentPage({ equipment, reload, notify }) {
    const [showAdd, setShowAdd] = useState(false);
    const [form, setForm] = useState({ equipment_id: '', equipment_type: 'telehandler_12k', category: 'field', make: '', model: '', serial_number: '', capacity: '' });

    const addEquipment = async () => {
        if (!form.equipment_id.trim()) { notify('Equipment ID required', 'error'); return; }
        try {
            await API.post('/equipment', form);
            notify('Equipment added');
            setShowAdd(false);
            setForm({ equipment_id: '', equipment_type: 'telehandler_12k', category: 'field', make: '', model: '', serial_number: '', capacity: '' });
            reload();
        } catch (e) { notify('Failed: ' + e.message, 'error'); }
    };

    const deactivate = async (id) => {
        if (!confirm('Deactivate this equipment?')) return;
        try {
            await API.del(`/equipment/${id}`);
            notify('Equipment deactivated');
            reload();
        } catch (e) { notify('Failed: ' + e.message, 'error'); }
    };

    return (
        <div className="space-y-4">
            <div className="flex items-center justify-between">
                <h2 className="text-2xl font-bold text-sse-navy">Equipment</h2>
                <button onClick={() => setShowAdd(!showAdd)}
                    className="px-4 py-2 bg-sse-orange text-white rounded-lg font-medium hover:bg-orange-600">
                    + Add Equipment
                </button>
            </div>

            {showAdd && (
                <div className="bg-white rounded-xl border p-4 space-y-3">
                    <h3 className="font-bold text-sse-navy">Add New Equipment</h3>
                    <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
                        <input type="text" placeholder="Equipment ID (e.g. CRANE-01)" value={form.equipment_id}
                            onChange={e => setForm({ ...form, equipment_id: e.target.value })}
                            className="border rounded-lg px-3 py-2 text-sm" />
                        <select value={form.equipment_type} onChange={e => setForm({ ...form, equipment_type: e.target.value })}
                            className="border rounded-lg px-3 py-2 text-sm">
                            <option value="telehandler_33k">Telehandler 33K</option>
                            <option value="telehandler_12k">Telehandler 12K</option>
                            <option value="emi_tube_cutter">EMI Tube Cutter</option>
                            <option value="miller_welder">Miller Welder</option>
                        </select>
                        <select value={form.category} onChange={e => setForm({ ...form, category: e.target.value })}
                            className="border rounded-lg px-3 py-2 text-sm">
                            <option value="field">Field</option>
                            <option value="shop">Shop</option>
                        </select>
                        <input type="text" placeholder="Make" value={form.make}
                            onChange={e => setForm({ ...form, make: e.target.value })}
                            className="border rounded-lg px-3 py-2 text-sm" />
                        <input type="text" placeholder="Model" value={form.model}
                            onChange={e => setForm({ ...form, model: e.target.value })}
                            className="border rounded-lg px-3 py-2 text-sm" />
                        <input type="text" placeholder="Serial Number" value={form.serial_number}
                            onChange={e => setForm({ ...form, serial_number: e.target.value })}
                            className="border rounded-lg px-3 py-2 text-sm" />
                        <input type="text" placeholder="Capacity" value={form.capacity}
                            onChange={e => setForm({ ...form, capacity: e.target.value })}
                            className="border rounded-lg px-3 py-2 text-sm" />
                        <button onClick={addEquipment} className="bg-green-600 text-white rounded-lg px-4 py-2 text-sm font-medium hover:bg-green-700">Save</button>
                    </div>
                </div>
            )}

            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                {equipment.map(eq => (
                    <div key={eq.id} className="bg-white rounded-xl border p-4">
                        <div className="flex items-start justify-between">
                            <div className="flex items-center gap-3">
                                <span className="text-3xl">{EQUIPMENT_DISPLAY[eq.equipment_type]?.icon || '📦'}</span>
                                <div>
                                    <p className="font-bold text-lg">{getEquipmentNickname(eq)}</p>
                                    <p className="text-sm text-gray-500">{eq.make} {eq.model}</p>
                                    <p className="text-xs text-gray-400">ID: {eq.equipment_id} {eq.serial_number ? `| S/N: ${eq.serial_number}` : ''}</p>
                                    <p className="text-xs text-gray-400">Category: {eq.category} {eq.capacity ? `| ${eq.capacity}` : ''}</p>
                                </div>
                            </div>
                            <button onClick={() => deactivate(eq.id)} className="text-red-400 hover:text-red-600 text-sm">Deactivate</button>
                        </div>
                    </div>
                ))}
            </div>
        </div>
    );
}

// =============================================================================
// SHARED COMPONENTS
// =============================================================================
function LoadingSpinner() {
    return (
        <div className="flex items-center justify-center py-12">
            <div className="w-10 h-10 border-4 border-sse-orange border-t-transparent rounded-full animate-spin"></div>
        </div>
    );
}
